

name: Docker Build and Push to Docker Hub

on:
  push:
    branches:
      - main
      - develop

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Run deployment script
        run: |
          docker build -t library-book-management:latest .
          docker tag library-book-management:latest ${{ secrets.DOCKER_USERNAME }}/library-book-management:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/library-book-management:latest 
